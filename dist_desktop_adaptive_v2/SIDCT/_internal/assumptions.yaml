# ASSUMPTIONS — SIDCT v1.0
# Registo de todas as simplificações e pressupostos adoptados neste sistema.

assumptions:

  hydraulic_incompressible:
    - id: A-HI-001
      description: "Colebrook-White: solução iterativa com tolerância 1e-8 no factor de atrito f"
      impact: "Desprezável para engenharia. Erro < 0.01% em relação à equação implícita."
      applies_to: [potable_water, service_water, osmotized_water, chilled_water, condenser_water, fire_water]

    - id: A-HI-002
      description: "Perdas menores (fittings): K-values de literatura pública (Crane TP-410 / Idel'chik)"
      impact: >
        K-values representativos para fittings padrão. Para fittings especiais ou de fabricante
        específico, o utilizador deve fornecer K-value real.
      applies_to: all_incompressible

    - id: A-HI-003
      description: "Diâmetro interno calculado como: Di = Do - 2*WT (WT = wall thickness do schedule)"
      impact: "Exacto para tubos de parede uniforme."
      applies_to: all_incompressible

    - id: A-HI-004
      description: "Escoamento isotérmico e regime permanente"
      impact: "Não modela transientes ou variações de temperatura ao longo da linha."
      applies_to: all_incompressible

  hydraulic_compressible:
    - id: A-HC-001
      description: "Modelo isotérmico compressível (T = const ao longo da linha)"
      impact: >
        Conservativo para gases frios em tubagens isoladas.
        Para gases com variação significativa de temperatura: resultado é conservativo (ΔP maior).
      applies_to: [compressed_air, natural_gas]

    - id: A-HC-002
      description: >
        Gás natural modelado como CH4 puro quando composição não fornecida.
        Peso molecular = 16.04 g/mol, γ = 1.31 (aproximação).
      impact: >
        Para gas natural com C2+ > 5%: erro crescente nas propriedades.
        Warning emitido obrigatoriamente quando composição não fornecida.
      applies_to: [natural_gas]

    - id: A-HC-003
      description: "Ar comprimido modelado como ar seco via CoolProp"
      impact: "Ar com alta humidade (> 70% RH): propriedades ligeiramente diferentes. Warning emitido se T_dew estimada próxima de T_oper."
      applies_to: [compressed_air]

    - id: A-HC-004
      description: "Envelope do modelo: Ma < 0.3 e pressure ratio P2/P1 > 0.5"
      impact: "Fora do envelope: status OUT_OF_SCOPE. Requer modelo mais rigoroso (Fanno, Rayleigh)."
      applies_to: [compressed_air, natural_gas]

  hydraulic_gravity:
    - id: A-HG-001
      description: "Manning: regime permanente uniforme (depth constante ao longo do comprimento)"
      impact: "Não modela aceleração/desaceleração ou variações de slope. Adequado para dimensionamento."
      applies_to: [sanitary_drainage, rainwater]

    - id: A-HG-002
      description: "Coeficiente de Manning n: valor tabelado por material"
      impact: "Incerteza ±10% em n é típica. Manning conservativo com n maior."
      applies_to: [sanitary_drainage, rainwater]

    - id: A-HG-003
      description: "Fluido: água limpa a 20°C (ρ = 998 kg/m³, μ = 1.0 mPa·s)"
      impact: "Para águas residuais com sólidos ou óleos: rugosidade efectiva pode ser maior."
      applies_to: [sanitary_drainage, rainwater]

    - id: A-HG-004
      description: "Profundidade de escoamento calculada por iteração (secção circular parcialmente cheia)"
      impact: "Convergência verificada. Resultado: profundidade relativa y/D e velocidade."
      applies_to: [sanitary_drainage, rainwater]

  vacuum:
    - id: A-VAC-001
      description: "Regime viscoso assumido (Kn < 0.01) para cálculo de condutância"
      impact: >
        Para vácuo fino (P < 0.1 mbar) o regime pode ser molecular.
        Warning emitido quando P < 1 mbar.
      applies_to: [vacuum_utility]

    - id: A-VAC-002
      description: "Pressão externa de projecto = 1.01325 bar abs (pressão atmosférica) para vácuo completo"
      impact: "Conservativo. Para sistemas de vácuo parcial: P_ext = P_atm - P_oper."
      applies_to: [vacuum_utility]

  thickness_internal:
    - id: A-TI-001
      description: "Factor E (weld joint efficiency): 1.0 para tubos seamless; 0.85 para ERW (quando não especificado)"
      impact: "E < 1 penaliza espessura. Utilizador deve confirmar processo de fabrico."
      applies_to: all_profiles

    - id: A-TI-002
      description: "Factor Y (ASME B31.3): valor tabelado por material e temperatura"
      impact: "Y = 0.4 usado como conservativo quando material não está na tabela pública."
      applies_to: [ASME_B31_3, ASME_B31_9]

    - id: A-TI-003
      description: "Corrosion allowance: valor do perfil/serviço quando não especificado pelo utilizador"
      impact: "Warning quando CA = 0 para serviços com potencial corrosivo."
      applies_to: all_services

    - id: A-TI-004
      description: "Mill tolerance: 12.5% para tubos ASTM (padrão ASME B36.10/B36.19)"
      impact: "t_req = t_pressure + CA. t_req_after_mill = t_req / (1 - 0.125)"
      applies_to: all_profiles

    - id: A-TI-005
      description: >
        Tensões admissíveis: subset de literatura pública para materiais comuns
        (A106 GrB, A53 GrB, A312 TP304, A312 TP316). Para outros materiais: DATASET_MISSING.
      impact: "Utilizador deve fornecer S (allowable stress) para materiais fora do subset."
      applies_to: all_profiles

  thickness_external:
    - id: A-TE-001
      description: >
        Verificação de colapso por pressão externa encaminhada para método ASME/EN.
        Requer charts L/D vs Do/t (ASME Fig. G equivalente) — dataset externo.
      impact: >
        Sem dataset: status DATASET_MISSING. Verificação manual obrigatória por engenheiro
        qualificado.
      applies_to: [vacuum_utility]

    - id: A-TE-002
      description: "P_external_design = P_atm = 1.01325 bar abs para vácuo completo"
      impact: "Conservativo. Pressão diferencial máxima."
      applies_to: [vacuum_utility]

  supports:
    - id: A-SUP-001
      description: "Ferramenta de suportes classificada como 'preliminar / semi-detalhada'"
      impact: "NÃO substitui análise completa de flexibilidade e tensões."
      applies_to: all_services

    - id: A-SUP-002
      description: "Vão máximo por flecha admissível: deflexão estática simples viga biapoiada"
      impact: "Conservativo quando há fixações intermédias. Não considera carga dinâmica."
      applies_to: all_services

    - id: A-SUP-003
      description: "Carga sísmica horizontal: g × massa total × factor sísmico paramétrico"
      impact: "Factor sísmico deve ser definido pelo utilizador com base no local. Default: 0.1g."
      applies_to: all_services

  materials:
    - id: A-MAT-001
      description: >
        Dataset de tensões admissíveis:
        A106 GrB: S = 138 MPa (≤ 370°C), baseado em ASME B31.3 publicações públicas.
        A53 GrB: S = 103 MPa (≤ 370°C), baseado em ASME B31.3 publicações públicas.
        A312 TP304: S = 115 MPa (≤ 400°C), baseado em EN 13480 publicações públicas.
        A312 TP316: S = 115 MPa (≤ 400°C), baseado em EN 13480 publicações públicas.
      impact: >
        Para outros materiais ou temperaturas fora da faixa: DATASET_MISSING.
        Utilizador deve fornecer S do Appendix A da norma aplicável.
      applies_to: all_profiles
