schema_version: "1.0"
purpose: "Engineering decision matrix for system-to-pipe-material selection."
status_levels:
  preferred: "Usually preferred for the stated context."
  allowed: "Technically acceptable when design limits and certification are met."
  conditional: "Context-dependent; show warning and require engineering confirmation."
  not_recommended: "Possible in narrow cases but should not be offered by default."
  blocked: "Do not offer for this system in SIDCT."

systems:
  potable_water:
    system_name: "Potable water"
    future_extension_ready: true
    engineering_notes:
      - "Potable water selection is driven by health certification, hygiene, corrosion risk, stagnation, disinfection chemistry and local approvals."
      - "US projects should require NSF/ANSI/CAN 61 or equivalent product certification. EU projects should require local potable-water approvals and hygienic suitability."
      - "Do not confuse BIM availability with engineering suitability."
    regions:
      EU:
        preferred_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["high hygiene", "plant rooms", "industrial potable water", "low corrosion allowance philosophy"]
            limitations: ["chloride concentration and disinfection regime must be checked", "avoid inappropriate grade in high chloride water"]
            warnings: ["Verify potable-water approval for pipe, fittings, seals and press system."]
            selection_rank: 1
          - material_id: ppr_potable
            display_name: "PPR potable grade"
            sidct_material: "PPR"
            calculation_ready: true
            contexts: ["building services", "hot and cold water distribution"]
            limitations: ["thermal expansion", "support spacing", "oxygen diffusion/version suitability"]
            warnings: ["SIDCT uses ISO 15874 SDR dimensions and simplified pressure screening; verify supplier pressure-temperature tables and potable approvals."]
            selection_rank: 2
          - material_id: copper
            display_name: "Copper"
            sidct_material: "Copper"
            calculation_ready: false
            contexts: ["domestic plumbing", "plant rooms", "hot water"]
            limitations: ["water chemistry, pH, velocity erosion and dezincification-compatible fittings must be checked"]
            warnings: ["Dataset not implemented; verify water chemistry and local approvals."]
            selection_rank: 3
        allowed_materials:
          - material_id: hdpe_potable
            display_name: "HDPE/PEAD potable grade"
            sidct_material: "HDPE"
            calculation_ready: true
            contexts: ["buried service entry", "external distribution", "utility yards"]
            limitations: ["not preferred for exposed high-temperature indoor plant rooms", "thermal movement and UV protection required"]
            warnings: ["SIDCT uses PE100 EN 12201 dimensions and simplified pressure screening; verify potable certification, SDR/PN and installation class."]
            selection_rank: 4
          - material_id: pvc_u_potable
            display_name: "PVC-U potable grade"
            sidct_material: "PVC"
            calculation_ready: true
            contexts: ["cold water only", "external/distribution where allowed"]
            limitations: ["temperature derating", "impact/UV protection", "not for hot water"]
            warnings: ["Verify potable certification and pressure-temperature derating."]
            selection_rank: 5
        conditional_materials:
          - material_id: stainless_steel_304
            display_name: "Stainless steel 304"
            sidct_material: "A312 TP304"
            calculation_ready: true
            contexts: ["low chloride potable water", "indoor plant rooms"]
            limitations: ["less robust than 316 in chloride or aggressive disinfection contexts"]
            warnings: ["Use 316 instead where chloride/disinfection risk is material."]
            selection_rank: 6
          - material_id: carbon_steel_lined_potable
            display_name: "Carbon steel, internally lined for potable water"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["industrial potable-water mains", "utility yards", "large bore distribution", "where stainless/plastic is not practical"]
            limitations: ["must be internally lined/coated and approved for potable water contact", "do not treat as black/unlined carbon steel", "lining/coating thickness, joint detailing and field repairs require project specification"]
            warnings: ["Require potable-water approval for lining/coating and all wetted components; calculate hydraulics using A53 GrB as SIDCT proxy until EN 10224/AWWA C200 datasets are implemented."]
            selection_rank: 7
        blocked_materials:
          - material_id: carbon_steel_black
            display_name: "Black carbon steel"
            reason: "High corrosion and water quality risk for potable water unless internally lined and approved."
          - material_id: cpvc_industrial
            display_name: "Generic industrial CPVC"
            reason: "Only potable-listed CPVC products should be considered; generic CPVC is blocked."
      US:
        preferred_materials:
          - material_id: copper
            display_name: "Copper"
            sidct_material: "Copper"
            calculation_ready: false
            contexts: ["domestic plumbing", "hot/cold potable water"]
            limitations: ["water chemistry and velocity erosion limits"]
            warnings: ["Dataset not implemented; require NSF/ANSI/CAN 61 listing."]
            selection_rank: 1
          - material_id: pex
            display_name: "PEX"
            sidct_material: "PEX"
            calculation_ready: false
            contexts: ["domestic/building potable water"]
            limitations: ["temperature/pressure class", "UV exposure", "chemical compatibility with disinfectants"]
            warnings: ["Dataset not implemented; require NSF/ANSI/CAN 61 listing."]
            selection_rank: 2
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["industrial potable water", "hygienic plant rooms"]
            limitations: ["verify chloride and disinfection compatibility"]
            warnings: ["Verify potable listing for all wetted components."]
            selection_rank: 3
        allowed_materials:
          - material_id: hdpe_potable
            display_name: "HDPE potable grade"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["buried service and distribution"]
            limitations: ["pressure class, fusion quality, UV and burial conditions"]
            warnings: ["Dataset not implemented; require NSF/ANSI/CAN 61 listing."]
            selection_rank: 4
          - material_id: pvc_u_potable
            display_name: "PVC-U potable grade"
            sidct_material: "PVCU_US"
            calculation_ready: true
            contexts: ["cold water distribution where code permits"]
            limitations: ["temperature derating", "not for hot water"]
            warnings: ["Verify NSF/ANSI/CAN 61 and pressure-temperature derating."]
            selection_rank: 5
        conditional_materials:
          - material_id: carbon_steel_lined_potable
            display_name: "AWWA steel water pipe, lined/coated for potable water"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["industrial potable-water mains", "large bore transmission/distribution", "buried or utility-yard pipework"]
            limitations: ["must be supplied as waterworks steel pipe with potable-water lining/coating", "not equivalent to unlined black steel process pipe", "AWWA C200/C205/C210/C213 or project-approved equivalent must be specified"]
            warnings: ["Require NSF/ANSI/CAN 61 or equivalent potable-water certification for lining/coating and wetted components; SIDCT uses A53 GrB as calculation proxy until AWWA C200 datasets are implemented."]
            selection_rank: 6
        blocked_materials:
          - material_id: carbon_steel_black
            display_name: "Black carbon steel"
            reason: "Not suitable for unlined potable water due corrosion and health/aesthetic risk."

  osmotized_water:
    system_name: "Osmotized / treated water"
    future_extension_ready: true
    engineering_notes:
      - "RO/demineralized water is chemically aggressive and can leach metals or attack inappropriate materials."
      - "Material choice depends strongly on conductivity, sanitization, microbial control and required purity."
    regions:
      EU:
        preferred_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["industrial RO water", "hygienic loops", "plant rooms"]
            limitations: ["verify surface finish, stagnant legs, chloride and sanitization chemistry"]
            warnings: ["Use hygienic design practice for high purity loops; avoid dead legs."]
            selection_rank: 1
          - material_id: pp_pure_water
            display_name: "PP/PPR high-purity compatible"
            sidct_material: "PPR"
            calculation_ready: false
            contexts: ["low conductivity water where plastic system is certified"]
            limitations: ["temperature, pressure, leaching, jointing quality"]
            warnings: ["Dataset not implemented; require supplier purity compatibility data."]
            selection_rank: 2
        allowed_materials:
          - material_id: hdpe_treated
            display_name: "HDPE/PEAD"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["treated water distribution with compatible purity requirements"]
            limitations: ["not ideal for high-temperature sanitization", "verify leachables and microbial strategy"]
            warnings: ["Dataset not implemented; verify water quality class."]
            selection_rank: 3
        conditional_materials:
          - material_id: stainless_steel_304
            display_name: "Stainless steel 304"
            sidct_material: "A312 TP304"
            calculation_ready: true
            contexts: ["less aggressive treated water"]
            limitations: ["higher corrosion risk than 316 in aggressive/chloride waters"]
            warnings: ["Prefer 316 for robust osmotized-water service."]
            selection_rank: 4
        blocked_materials:
          - material_id: carbon_steel
            display_name: "Carbon steel"
            reason: "Usually inappropriate for osmotized water due aggressive corrosion and contamination risk."
          - material_id: copper
            display_name: "Copper"
            reason: "Usually inappropriate for low-mineral/aggressive water unless water chemistry specifically permits."

  service_water:
    system_name: "Service / industrial water"
    future_extension_ready: true
    engineering_notes:
      - "Service water is broad; corrosion, solids, treatment chemicals, pressure and buried/exposed installation govern selection."
    regions:
      EU:
        preferred_materials:
          - material_id: carbon_steel
            display_name: "Carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["industrial plant rooms", "medium/high pressure", "mechanical robustness"]
            limitations: ["corrosion allowance/coating/lining may be required"]
            warnings: ["Confirm water treatment and corrosion allowance."]
            selection_rank: 1
          - material_id: hdpe_service
            display_name: "HDPE/PEAD"
            sidct_material: "HDPE"
            calculation_ready: true
            contexts: ["buried external networks", "utility yards", "corrosive soil"]
            limitations: ["temperature/pressure derating", "fusion quality", "fire exposure"]
            warnings: ["SIDCT uses PE100 EN 12201 dimensions and simplified pressure screening; verify SDR/PN, fusion QA and installation class."]
            selection_rank: 2
        allowed_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["corrosive water", "low maintenance", "clean plant rooms"]
            limitations: ["cost and chloride limits"]
            warnings: ["Check chloride and galvanic compatibility."]
            selection_rank: 3
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["industrial service water", "mechanical rooms", "utility headers where project specification allows A53"]
            limitations: ["corrosion allowance/coating/lining may be required", "verify project pipe class and joining method"]
            warnings: ["ASME B36.10M dimensional dataset is used; confirm local project standard and procurement specification."]
            selection_rank: 4
          - material_id: pvc_u
            display_name: "PVC-U"
            sidct_material: "PVC"
            calculation_ready: true
            contexts: ["cold low/medium pressure service water"]
            limitations: ["temperature, impact, UV, supports"]
            warnings: ["Not suitable for hot water or fire exposure."]
            selection_rank: 5
        conditional_materials:
          - material_id: ppr
            display_name: "PPR"
            sidct_material: "PPR"
            calculation_ready: true
            contexts: ["building/service distribution"]
            limitations: ["thermal expansion and pressure-temperature rating"]
            warnings: ["SIDCT uses ISO 15874 SDR dimensions and simplified pressure screening; verify supplier pressure-temperature tables."]
            selection_rank: 5
        blocked_materials: []

  chilled_water:
    system_name: "Chilled water"
    future_extension_ready: true
    engineering_notes:
      - "Closed-loop chilled water is commonly carbon steel in larger mechanical systems; condensation protection, corrosion treatment and oxygen ingress are critical."
    regions:
      EU:
        preferred_materials:
          - material_id: carbon_steel
            display_name: "Carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["data centre", "industrial HVAC", "large bore distribution"]
            limitations: ["closed-loop treatment required", "external condensation/corrosion protection"]
            warnings: ["Confirm water treatment and insulation/vapour barrier."]
            selection_rank: 1
        allowed_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["corrosion-sensitive plant rooms", "small/medium bore", "clean areas"]
            limitations: ["cost, chloride compatibility"]
            warnings: ["Check galvanic interfaces and chloride."]
            selection_rank: 2
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["closed-loop chilled water where A53 is in the project pipe class"]
            limitations: ["closed-loop treatment required", "external condensation/corrosion protection"]
            warnings: ["ASME B36.10M dimensional dataset is used; confirm local project standard and corrosion policy."]
            selection_rank: 3
          - material_id: hdpe_chilled
            display_name: "HDPE/PEAD"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["buried chilled water", "district cooling sections"]
            limitations: ["temperature/pressure derating", "movement and fusion QA"]
            warnings: ["Dataset not implemented; verify manufacturer district-energy data."]
            selection_rank: 4
        conditional_materials:
          - material_id: ppr_ct
            display_name: "PPR/PP-RCT"
            sidct_material: "PPR"
            calculation_ready: false
            contexts: ["small/medium building services"]
            limitations: ["thermal movement, oxygen diffusion, support spacing"]
            warnings: ["Dataset not implemented; check pressure class at operating temperature."]
            selection_rank: 4
        blocked_materials:
          - material_id: pvc_u
            display_name: "PVC-U"
            reason: "Usually not preferred for closed-loop chilled water in technical plant rooms; brittle/temperature/support/fire issues."

  condenser_water:
    system_name: "Condenser water"
    future_extension_ready: true
    engineering_notes:
      - "Open condenser water circuits are corrosion- and fouling-sensitive; treatment chemistry, biological control and tower exposure govern selection."
    regions:
      EU:
        preferred_materials:
          - material_id: carbon_steel
            display_name: "Carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["large condenser water systems", "mechanical plant"]
            limitations: ["corrosion treatment/coating, fouling, tower water quality"]
            warnings: ["Confirm chemical treatment and corrosion allowance."]
            selection_rank: 1
        allowed_materials:
          - material_id: hdpe_condenser
            display_name: "HDPE/PEAD"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["buried external sections", "cooling tower yards"]
            limitations: ["temperature/pressure, UV, supports above ground"]
            warnings: ["Dataset not implemented."]
            selection_rank: 2
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["corrosive environments", "selected plant-room sections"]
            limitations: ["chloride and microbial corrosion risk"]
            warnings: ["Do not assume stainless is immune to tower-water corrosion."]
            selection_rank: 3
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["condenser-water headers where A53 is in the project pipe class"]
            limitations: ["tower-water treatment, fouling and corrosion allowance must be specified"]
            warnings: ["ASME B36.10M dimensional dataset is used; confirm local project standard and water treatment."]
            selection_rank: 4
        conditional_materials:
          - material_id: pvc_u
            display_name: "PVC-U"
            sidct_material: "PVC"
            calculation_ready: true
            contexts: ["low-temperature low-pressure auxiliary sections"]
            limitations: ["temperature, UV, impact and fire exposure"]
            warnings: ["Use only where local code and owner standards permit."]
            selection_rank: 5
        blocked_materials: []

  natural_gas:
    system_name: "Natural gas"
    future_extension_ready: true
    engineering_notes:
      - "Natural gas material selection is installation-context driven: buried distribution, exposed indoor piping, risers and plant rooms have different acceptable materials."
      - "Plastic gas pipe is not a generic indoor pipe. Transition/riser assemblies and local gas code approval are mandatory."
    regions:
      EU:
        preferred_materials:
          - material_id: carbon_steel_black
            display_name: "Black carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["exposed plant rooms", "industrial gas trains", "above-ground gas piping"]
            limitations: ["corrosion protection outdoors", "threaded/welded/grooved method per gas code"]
            warnings: ["Verify local gas code, ventilation and hazardous area requirements."]
            selection_rank: 1
        allowed_materials:
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["above-ground fuel-gas piping where project gas code and pipe class allow A53"]
            limitations: ["corrosion protection outdoors", "threaded/welded/grooved method per gas code"]
            warnings: ["Verify local gas code, utility/AHJ acceptance and hazardous area requirements."]
            selection_rank: 2
          - material_id: copper_gas
            display_name: "Copper gas tube"
            sidct_material: "Copper"
            calculation_ready: false
            contexts: ["selected building gas installations where permitted"]
            limitations: ["local gas code restrictions; not universal"]
            warnings: ["Dataset not implemented; confirm jurisdiction allows copper for gas."]
            selection_rank: 3
        conditional_materials:
          - material_id: pe_gas
            display_name: "PE/HDPE gas pipe"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["buried gas distribution/service lines"]
            limitations: ["not for exposed indoor piping", "requires gas-grade pipe, fusion QA, tracing and approved risers"]
            warnings: ["Dataset not implemented; use only for buried gas service with local code approval."]
            selection_rank: 3
          - material_id: multilayer_gas
            display_name: "Certified multilayer gas pipe"
            sidct_material: "Multilayer Gas"
            calculation_ready: false
            contexts: ["selected interior building systems where approved"]
            limitations: ["manufacturer system approval only; not generic PE-AL-PE"]
            warnings: ["Dataset not implemented; require gas listing and local approval."]
            selection_rank: 4
        blocked_materials:
          - material_id: pvc_u
            display_name: "PVC-U"
            reason: "Not suitable for natural gas in SIDCT."
          - material_id: ppr
            display_name: "PPR"
            reason: "Not a natural-gas piping material in this scope."
      US:
        preferred_materials:
          - material_id: carbon_steel_black
            display_name: "Black carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["exposed indoor/above-ground fuel gas piping", "industrial gas trains"]
            limitations: ["corrosion protection outdoors", "NFPA/local fuel gas code requirements"]
            warnings: ["Verify local fuel gas code and AHJ requirements."]
            selection_rank: 1
        allowed_materials:
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["above-ground fuel-gas piping where NFPA/local fuel gas code and pipe class allow A53"]
            limitations: ["corrosion protection outdoors", "threaded/welded/grooved method per gas code"]
            warnings: ["Verify local fuel gas code, utility/AHJ acceptance and product listing where required."]
            selection_rank: 2
        conditional_materials:
          - material_id: pe_gas
            display_name: "PE/HDPE gas pipe"
            sidct_material: "HDPE"
            calculation_ready: false
            contexts: ["buried gas distribution mains and services"]
            limitations: ["must comply with gas-pipe regulations and listed standards; not exposed indoor pipe"]
            warnings: ["Dataset not implemented; requires code-approved gas-grade PE and riser/transition design."]
            selection_rank: 2
          - material_id: copper_gas
            display_name: "Copper gas tube"
            sidct_material: "Copper"
            calculation_ready: false
            contexts: ["where local code and gas composition permit"]
            limitations: ["jurisdiction and gas composition dependent"]
            warnings: ["Dataset not implemented; confirm fuel gas code and utility acceptance."]
            selection_rank: 3
        blocked_materials:
          - material_id: pvc_u
            display_name: "PVC-U"
            reason: "Not suitable for natural gas in SIDCT."

  compressed_air:
    system_name: "Compressed air"
    future_extension_ready: true
    engineering_notes:
      - "Compressed air stores significant energy; brittle or non-rated plastic systems are high-risk."
      - "Oil carryover, condensate, pressure class, fire exposure and mechanical damage govern selection."
    regions:
      EU:
        preferred_materials:
          - material_id: aluminum_air
            display_name: "Aluminium compressed-air system"
            sidct_material: "Aluminium Air"
            calculation_ready: false
            contexts: ["factory distribution", "dry compressed air headers"]
            limitations: ["manufacturer system pressure and temperature limits"]
            warnings: ["Dataset not implemented; use listed compressed-air system only."]
            selection_rank: 1
          - material_id: carbon_steel
            display_name: "Carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["industrial plant", "compressor rooms", "large bore headers"]
            limitations: ["internal corrosion from condensate; filtration/drying needed"]
            warnings: ["Check air dryness, corrosion allowance and receiver safety philosophy."]
            selection_rank: 2
        allowed_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["clean dry air", "instrument/clean applications"]
            limitations: ["cost; pressure class of fittings"]
            warnings: ["Verify all fittings are rated for compressed air."]
            selection_rank: 3
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["compressed-air headers where A53 is in the project pipe class"]
            limitations: ["internal corrosion from condensate; filtration/drying needed"]
            warnings: ["Verify pressure rating, receiver safety philosophy and project pipe class."]
            selection_rank: 4
        conditional_materials:
          - material_id: ppr_air
            display_name: "Compressed-air-rated PPR"
            sidct_material: "PPR"
            calculation_ready: false
            contexts: ["small networks only when explicitly rated by manufacturer"]
            limitations: ["pressure-temperature derating; mechanical protection"]
            warnings: ["Dataset not implemented; generic PPR must not be used for compressed air."]
            selection_rank: 5
        blocked_materials:
          - material_id: pvc_u
            display_name: "PVC-U"
            reason: "Brittle failure risk; not offered for compressed air."
          - material_id: hdpe_generic
            display_name: "Generic HDPE"
            reason: "Only specifically rated compressed-air plastic systems may be considered."

  vacuum_utility:
    system_name: "Utility vacuum"
    future_extension_ready: true
    engineering_notes:
      - "Vacuum design must consider external pressure collapse, leak tightness and mechanical robustness."
    regions:
      EU:
        preferred_materials:
          - material_id: stainless_steel_316
            display_name: "Stainless steel 316"
            sidct_material: "A312 TP316"
            calculation_ready: true
            contexts: ["industrial vacuum", "clean vacuum", "plant rooms"]
            limitations: ["external pressure/collapse check remains mandatory"]
            warnings: ["Do not approve vacuum line without external pressure check."]
            selection_rank: 1
          - material_id: carbon_steel
            display_name: "Carbon steel"
            sidct_material: "A106 GrB"
            calculation_ready: true
            contexts: ["industrial utility vacuum", "robust plant piping"]
            limitations: ["corrosion and collapse check"]
            warnings: ["External pressure check required."]
            selection_rank: 2
        allowed_materials:
          - material_id: carbon_steel_a53
            display_name: "Carbon steel A53 GrB"
            sidct_material: "A53 GrB"
            calculation_ready: true
            contexts: ["industrial utility vacuum where A53 is in the project pipe class"]
            limitations: ["external pressure/collapse check remains mandatory", "corrosion protection may be required"]
            warnings: ["External pressure check is still required; ASME B36.10M dimensional dataset is used."]
            selection_rank: 3
        conditional_materials:
          - material_id: pvc_vacuum_light
            display_name: "PVC/HDPE for light vacuum"
            sidct_material: "PVC"
            calculation_ready: true
            contexts: ["central vacuum/low duty where product is rated"]
            limitations: ["collapse, temperature, leak tightness, static, chemical compatibility"]
            warnings: ["Use only with manufacturer vacuum rating; not for high industrial vacuum."]
            selection_rank: 4
        blocked_materials:
          - material_id: ppr
            display_name: "PPR"
            reason: "Not offered for SIDCT vacuum checks without manufacturer vacuum dataset."

  sanitary_drainage:
    system_name: "Sanitary drainage"
    future_extension_ready: true
    engineering_notes:
      - "Drainage selection is driven by gravity hydraulics, acoustic requirement, fire rating, temperature and chemical discharge."
    regions:
      EU:
        preferred_materials:
          - material_id: pvc_u_drain
            display_name: "PVC-U SN drain pipe"
            sidct_material: "PVC"
            calculation_ready: true
            contexts: ["gravity drainage", "buried/indoor where code permits"]
            limitations: ["temperature and fire/acoustic requirements"]
            warnings: ["Check SN class for buried loading and local fire/acoustic requirements."]
            selection_rank: 1
          - material_id: pp_silent
            display_name: "PP silent drainage"
            sidct_material: "PP"
            calculation_ready: false
            contexts: ["indoor acoustic drainage"]
