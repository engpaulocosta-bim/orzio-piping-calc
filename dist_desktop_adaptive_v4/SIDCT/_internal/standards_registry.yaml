# STANDARDS REGISTRY — SIDCT v1.0
# Cada norma declarada com papel, escopo e status de disponibilidade.
# REGRA: nenhum campo normativo deve ser inventado neste ficheiro.

standards:

  # ─── CÓDIGOS PRIMÁRIOS DE PROJETO ──────────────────────────────────────────

  - id: ASME_B31_3
    title: "Process Piping"
    edition: "2022"
    jurisdiction: "international"
    scope: >
      Tubagens de processo incluindo fluidos inflamáveis, tóxicos, corrosivos,
      alta pressão e alta temperatura. Aplicável a refinarias, petroquímica,
      indústria química, utilities industriais.
    role: primary_design_code
    source_status: licensed_required
    applicability:
      - compressed_air
      - natural_gas
      - potable_water
      - service_water
      - osmotized_water
      - vacuum_utility
      - fire_water
    notes: >
      Tabelas de tensão admissível (Appendix A) são propriedade ASME/licenciadas.
      Este sistema usa subset de literatura pública para carbono e inox comuns.
      Para materiais fora do subset: status DATASET_MISSING.

  - id: ASME_B31_9
    title: "Building Services Piping"
    edition: "2022"
    jurisdiction: "international"
    scope: >
      Tubagens de serviços prediais: aquecimento, arrefecimento, gás combustível,
      ar comprimido, água potável — em edifícios e instalações similares.
      Limites de pressão e temperatura mais conservativos que B31.3.
    role: primary_design_code
    source_status: licensed_required
    applicability:
      - chilled_water
      - condenser_water
      - potable_water
      - service_water
      - compressed_air
      - fire_water
    notes: >
      B31.9 aplica-se a data centres e building services. Limites: P ≤ 1.7 MPag
      para vapor; P ≤ 2.1 MPag para outros fluidos (não-vapour, não-inflamáveis).

  - id: EN_13480
    title: "Metallic Industrial Piping"
    edition: "2017+A1:2020"
    jurisdiction: "EU"
    scope: >
      Tubagens metálicas industriais. Série de normas EN 13480-1 a EN 13480-8.
      Cobre projeto, materiais, fabrico, instalação, inspeção e ensaios.
    role: primary_design_code
    source_status: licensed_required
    applicability:
      - compressed_air
      - natural_gas
      - potable_water
      - service_water
      - osmotized_water
      - chilled_water
      - condenser_water
      - vacuum_utility
    notes: >
      EN 13480-3 contém fórmulas de espessura (similares a B31.3 mas com
      coeficientes específicos). Tensões admissíveis em EN 13480-2 Annexe B
      — propriedade CEN/licenciadas.

  - id: EN_12845
    title: "Fixed firefighting systems — Automatic sprinkler systems"
    edition: "2015+A1:2019"
    jurisdiction: "EU"
    scope: >
      Sistemas fixos de combate a incêndio por aspersão automática.
      Inclui critérios de dimensionamento hidráulico, materiais e instalação.
    role: primary_design_code
    source_status: licensed_required
    applicability:
      - fire_water
    notes: >
      Critérios de velocidade e pressão residual parametrizados por hazard class.
      Este sistema implementa apenas verificação de velocidade e DN.

  - id: NFPA_13
    title: "Standard for the Installation of Sprinkler Systems"
    edition: "2022"
    jurisdiction: "US"
    scope: >
      Norma americana para instalação de sistemas de sprinklers.
    role: primary_design_code
    source_status: licensed_required
    applicability:
      - fire_water
    notes: >
      Critérios de velocidade e pressão residual parametrizados por occupancy.

  # ─── INTEGRIDADE / INSPEÇÃO ─────────────────────────────────────────────────

  - id: API_570
    title: "Piping Inspection Code: In-service Inspection, Rating, Repair,
            and Alteration of Piping Systems"
    edition: "2016 (4th Ed)"
    jurisdiction: "international"
    scope: >
      Inspeção, avaliação, reparação e alteração de tubagens em serviço.
      NÃO é norma de dimensionamento de projeto novo.
    role: integrity_inspection_reference
    source_status: licensed_required
    applicability: []
    notes: >
      REGRA ABSOLUTA: API 570 NÃO é usado como norma primária de dimensionamento
      neste sistema. É referenciado apenas para contexto de inspeção/integridade.

  # ─── CATÁLOGOS DIMENSIONAIS ─────────────────────────────────────────────────

  - id: ASME_B36_10M
    title: "Welded and Seamless Wrought Steel Pipe"
    edition: "2015"
    jurisdiction: "international"
    scope: >
      Catálogo dimensional para tubos de aço carbono e baixa liga.
      DN 6 (NPS 1/8) a DN 1500 (NPS 60). Schedules: STD, XS, XXS, 10, 20,
      30, 40, 60, 80, 100, 120, 140, 160.
    role: dimensional_catalog
    source_status: public_data_reproduced
    applicability:
      - carbon_steel
      - low_alloy_steel
    notes: >
      Tabelas dimensionais (OD, WT, peso) reproduzíveis de domínio público.
      Materiais de catálogo: ASTM A53, A106, A333, A335.

  - id: ASME_B36_19M
    title: "Stainless Steel Pipe"
    edition: "2004 (R2015)"
    jurisdiction: "international"
    scope: >
      Catálogo dimensional para tubos de aço inoxidável.
      DN 6 (NPS 1/8) a DN 300 (NPS 12). Schedules: 5S, 10S, 40S, 80S.
    role: dimensional_catalog
    source_status: public_data_reproduced
    applicability:
      - stainless_steel
    notes: >
      REGRA ABSOLUTA: inox deve usar B36.19M, NÃO B36.10M, a menos que
      override explícito com justificação técnica.
      Materiais: ASTM A312 TP304/316, A358.

  - id: NBR_5580
    title: "Tubos de Aço-Carbono para Usos Comuns na Condução de Fluidos"
    edition: "2017"
    jurisdiction: "Brazil"
    scope: >
      Tubos de aço-carbono para uso geral. Dimensões em série comercial brasileira.
    role: dimensional_catalog
    source_status: dataset_external
    applicability:
      - carbon_steel
    notes: >
      Dataset opcional — apenas para perfil industrial_utilities_brazil.
      Sem dataset fornecido pelo utilizador: status DATASET_MISSING para este catálogo.
      Template em /data/templates/nbr5580_catalog.csv.

  # ─── NORMAS AUXILIARES ──────────────────────────────────────────────────────

  - id: NBR_6493
    title: "Emprego de Cores para Identificação de Tubulações"
    edition: "1994"
    jurisdiction: "Brazil"
    scope: >
      Identificação de tubulações por cores. Norma de identificação/tagging apenas.
    role: identification_tagging_only
    source_status: public_data_reproduced
    applicability: []
    notes: >
      REGRA ABSOLUTA: NBR 6493 é usada APENAS para identificação/rotulagem.
      NÃO é usada para cálculo de qualquer parâmetro técnico.

  - id: EN_12056
    title: "Gravity drainage systems inside buildings"
    edition: "2000"
    jurisdiction: "EU"
    scope: >
      Sistemas de drenagem gravitária em edifícios. Parte 2: Sanitary pipework.
      Parte 3: Roof drainage.
    role: gravity_drainage_reference
    source_status: licensed_required
    applicability:
      - sanitary_drainage
      - rainwater
    notes: >
      Critérios de velocidade mínima e inclinação mínima referenciados neste sistema.
      Motor de cálculo: Manning. Equações de domínio público.

  - id: ASME_B16_9
    title: "Factory-Made Wrought Buttwelding Fittings"
    edition: "2018"
    jurisdiction: "international"
    scope: "Dimensões de fittings soldados. Referência para K-values."
    role: fittings_reference
    source_status: licensed_required
    applicability: []
    notes: >
      K-values de literatura técnica (Crane TP-410, Idel'chik) usados
      neste sistema. NÃO reproduz tabelas proprietárias.

  - id: CRANE_TP410
    title: "Flow of Fluids Through Valves, Fittings, and Pipe"
    edition: "2013"
    jurisdiction: "international"
    scope: "Referência técnica para K-values e C_v de válvulas e fittings."
    role: k_values_reference
    source_status: public_reference
    applicability: []
    notes: >
      K-values típicos de literatura pública. Valores específicos de catálogos
      de fabricantes devem ser introduzidos pelo utilizador.
