# PROJECT PROFILES — SIDCT v1.0
# Cada perfil define critérios, normas e defaults para um contexto técnico específico.

profiles:

  glass_factory_industrial_eu:
    description: "Fábrica de vidro / utilities industriais — Europa"
    primary_design_code: "ASME_B31_3"
    alternate_design_code: "EN_13480"
    dimensional_catalogs_allowed:
      - "ASME_B36_10M"
      - "ASME_B36_19M"
    default_catalog_carbon: "ASME_B36_10M"
    default_catalog_stainless: "ASME_B36_19M"
    preferred_units: "SI_metric"  # bar, °C, m³/h, mm
    velocity_limits:
      compressed_air:
        normal_pipe: [5.0, 15.0]   # m/s [min, max]
        headers: [3.0, 8.0]
      natural_gas:
        normal_pipe: [5.0, 20.0]
        distribution: [3.0, 12.0]
      water_general:
        suction: [0.5, 1.5]
        discharge: [1.0, 3.0]
        headers: [0.5, 2.0]
      chilled_water: [0.5, 3.0]
      fire_water: [1.5, 4.0]
    corrosion_allowance_defaults:
      carbon_steel_water: 1.5    # mm
      carbon_steel_gas: 1.0
      stainless_steel: 0.0
      custom: null               # utilizador deve fornecer
    roughness_defaults:
      carbon_steel_new: 0.046e-3     # m (ASTM A53/A106)
      stainless_steel_new: 0.015e-3
      galvanized_steel: 0.15e-3
      pvc: 0.0015e-3
    compressible_services:
      - compressed_air
      - natural_gas
    gravity_services:
      - sanitary_drainage
      - rainwater
    external_pressure_services:
      - vacuum_utility
    fire_protection_special:
      - fire_water
    max_pressure_drop_criteria:
      compressed_air: 0.1        # bar/100m indicativo
      natural_gas: 0.05
      water_general: 0.30
      chilled_water: 0.20
    allowable_pressure_drop_override: null
    envelope:
      max_design_pressure_bar: 250
      max_design_temp_c: 600
      min_design_temp_c: -50
    warnings_extra:
      - "Perfil EU: verificar compatibilidade PED 2014/68/EU quando aplicável"
      - "EN 13480 como alternativa para tubagens de processo EU"

